services:
  # 后端服务
  backend:
    image: data-agent-backend:0.1
    container_name: data-agent-backend
    environment:
      - NL2SQL_DATASOURCE_URL=jdbc:mysql://192.168.1.69:3306/nl2sql_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - NL2SQL_DATASOURCE_USERNAME=root
      - NL2SQL_DATASOURCE_PASSWORD=root
      - AI_DASHSCOPE_API_KEY=${AI_DASHSCOPE_API_KEY}
    ports:
      - "8065:8065"
    networks:
      - app-network
    restart: no

  # Vue前端服务
  frontend:
    image: data-agent-frontend:0.1
    container_name: data-agent-frontend
    ports:
      - "3000:3000"  # 只暴露前端端口
    depends_on:
      - backend
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    name: "data-agent-network"
